        <div id="content" class="content" style="display:none;position:absolute;">

            <div id = "screen" class="screen">
                <div id = "scrollBar" class="scrollBar"></div>
            </div>
        </div>
        <div id="console" style="display: none;width: 641px; height: 964px; top: 0px; position: absolute; left: 1242px; background: var(--Mine-Shatf-2, #3E3E3E);">
            <label
                style="position: absolute;width: 99px;height: 42px;left: 271px;top: 0px;" class="consoleHeader">Console:</label>
            <label
                style="position: absolute;width: 162px;height: 44px;left: 0px;top: 66px;" class="consoleSmallMenu">Choose State Mode:</label>
                <pre id="consoleState" style="position: absolute;width: 469px;height: 895px;left: 162px;top: 66px; overflow-y: scroll;" class="state">
                </pre>

                <label
                style="position: absolute;width: 162px;height: 44px;left: 0px;top: 920px;" class="consoleSmallMenu">Password: pass</label>
        </div>
